name: Deploy do Barras do Maratoa no GitHub Pages

# Publica só a pasta barras-do-marataoa/ (HTML/CSS/JS estático) como raiz do site.
on:
  push:
    branches: [main]
    paths:
      - barras-do-marataoa/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: barras-do-marataoa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
